[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foray-ml"
version = "0.1.0"
description = "CTTS — 视觉 CNN 训练全流程工具集（foray_ml 模型产线）"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "httpx>=0.28",
    "label-studio-sdk>=2.1",
    "pyside6>=6.5",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
# CI / 轻量测试所需（不含 ultralytics / pyside6 / opencv，减少 CI 时间）
ci = ["numpy>=1.24", "httpx>=0.28", "label-studio-sdk>=2.1", "pytest>=8.0", "ruff>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ctts = "ctts.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
